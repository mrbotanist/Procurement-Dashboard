<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-6e82d67d-20a2-45e3-801e-d6f3e66cc691/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--color-bg:#f4f5f7;--color-surface:#f0f2f4;--color-text:#17181b;--color-divider:#e3e5e8;--color-accent:oklch(0.6 0.2 25);--color-neutral-100:#f7f8f9;--color-neutral-200:#eef0f2;--color-neutral-300:#e3e5e8;--color-neutral-400:#cdd0d5;--color-neutral-500:#a3a7ae;--color-neutral-600:#80848b;--color-neutral-700:#62666d;--color-neutral-800:#45484e;--color-neutral-900:#2b2d31;--font-heading:"Hanken Grotesk",system-ui,sans-serif;--font-body:"Hanken Grotesk",system-ui,sans-serif;--font-heading-weight:600;--radius-sm:6px;--radius-md:10px;--radius-lg:16px}
body{font-family:var(--font-body)}h1,h2,h3{letter-spacing:-.02em}
.btn{white-space:nowrap;flex:none;font-weight:600;border-radius:10px}.btn-primary{background:#17181b;color:#fff}.btn-primary:hover{background:#2e3035}.btn-primary:active{background:#000}.btn-secondary{background:#fff;border-color:#dcdfe3}.btn-secondary:hover{background:#f4f5f7}.btn-ghost{color:#17181b}.btn-ghost:hover{background:#eef0f2}.input{background:#fff;border-color:#dcdfe3;border-radius:10px}.input:focus-visible{border-color:oklch(0.6 0.15 255)}.seg{border-radius:10px;border-color:#dcdfe3;background:#fff;overflow:hidden}.dialog{background:#fff;border-radius:16px}:focus-visible{outline-color:oklch(0.6 0.15 255)}</style>
</helmet>
<div data-screen-label="12 Procurement Calendar" style="max-width:1480px;margin:0 auto;padding:var(--space-6) var(--space-6) 64px;display:flex;flex-direction:column;gap:var(--space-4)">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-bottom:var(--space-3);border-bottom:0">
    <div>
      <h1 style="margin:0 0 4px;font-size:28px">Procurement Calendar</h1>
      <p style="margin:0;font-size:15px;color:var(--color-neutral-700)">Payments, production milestones, shipments, customs and arrivals.</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button onClick="{{ prev }}" class="btn btn-secondary btn-icon">←</button>
      <span style="font-size:20px;font-weight:600;min-width:180px">{{ monthLabel }}</span>
      <button onClick="{{ next }}" class="btn btn-secondary btn-icon">→</button>
      <button onClick="{{ today }}" class="btn btn-secondary">Today</button>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <sc-for list="{{ types }}" as="t" hint-placeholder-count="5">
      <button onClick="{{ t.toggle }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:13px;border:1px solid var(--color-divider);opacity:{{ t.op }}" style-hover="background:var(--color-surface)"><span style="width:10px;height:10px;border-radius:50%;background:{{ t.c }}"></span>{{ t.k }}</button>
    </sc-for>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--color-divider);border-radius:16px;overflow:hidden;background:#fff">
    <sc-for list="{{ dows }}" as="d" hint-placeholder-count="7">
      <div style="padding:8px;font-size:12.5px;color:var(--color-neutral-700);border-right:1px solid var(--color-neutral-200);border-bottom:1px solid var(--color-divider)">{{ d }}</div>
    </sc-for>
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35">
      <div style="min-height:118px;padding:6px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--color-neutral-200);border-bottom:1px solid var(--color-neutral-200);background:{{ c.bg }}">
        <span style="font-size:14px;font-weight:{{ c.weight }};color:{{ c.fg }};align-self:flex-start;padding:0 4px;background:{{ c.numBg }}">{{ c.day }}</span>
        <sc-for list="{{ c.events }}" as="e" hint-placeholder-count="0">
          <button onClick="{{ e.go }}" title="{{ e.label }}" style="all:unset;cursor:pointer;display:grid;grid-template-columns:4px 1fr;gap:6px;font-size:12px;line-height:1.3;padding:3px 4px 3px 0;background:var(--color-bg)" style-hover="background:var(--color-neutral-200)"><span style="background:{{ e.c }}"></span><span>{{ e.label }}</span></button>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { y: 2026, mo: 8, off: {} };
  componentDidMount() {
    import(new URL('fpv-data-v2.js', document.baseURI).href).then(m => { this.m = m; this.forceUpdate(); });
  }
  renderVals() {
    const m = this.m;
    if (!m) return {};
    const { y, mo, off } = this.state;
    const first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, dim = new Date(y, mo + 1, 0).getDate();
    const total = Math.ceil((lead + dim) / 7) * 7;
    const cells = [];
    for (let i = 0; i < total; i++) {
      const d = new Date(y, mo, i - lead + 1), key = m.iso(d), inMonth = d.getMonth() === mo, isToday = key === m.TODAY;
      const events = m.EVENTS.filter(e => e[0] === key && !off[e[2]]).map(([, label, type, id]) => ({ label, c: m.EV_TYPES[type], go: () => m.store.openPo(id) }));
      cells.push({ day: d.getDate(), events, bg: inMonth ? 'transparent' : 'var(--color-neutral-100)', fg: isToday ? 'var(--color-bg)' : inMonth ? 'var(--color-text)' : 'var(--color-neutral-500)', numBg: isToday ? '#17181b' : 'transparent', weight: isToday ? 800 : 400 });
    }
    const shift = n => { const d = new Date(y, mo + n, 1); this.setState({ y: d.getFullYear(), mo: d.getMonth() }); };
    return {
      monthLabel: m.MONL[mo] + ' ' + y, prev: () => shift(-1), next: () => shift(1), today: () => this.setState({ y: 2026, mo: 8 }),
      dows: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], cells,
      types: Object.entries(m.EV_TYPES).map(([k, c]) => ({ k: k === 'Arrival' ? 'Expected arrival' : k, c, op: off[k] ? 0.4 : 1, toggle: () => this.setState(s => ({ off: { ...s.off, [k]: !s.off[k] } })) }))
    };
  }
}
</script>
</body>
</html>
