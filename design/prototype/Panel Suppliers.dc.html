<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-6e82d67d-20a2-45e3-801e-d6f3e66cc691/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--color-bg:#f4f5f7;--color-surface:#f0f2f4;--color-text:#17181b;--color-divider:#e3e5e8;--color-accent:oklch(0.6 0.2 25);--color-neutral-100:#f7f8f9;--color-neutral-200:#eef0f2;--color-neutral-300:#e3e5e8;--color-neutral-400:#cdd0d5;--color-neutral-500:#a3a7ae;--color-neutral-600:#80848b;--color-neutral-700:#62666d;--color-neutral-800:#45484e;--color-neutral-900:#2b2d31;--font-heading:"Hanken Grotesk",system-ui,sans-serif;--font-body:"Hanken Grotesk",system-ui,sans-serif;--font-heading-weight:600;--radius-sm:6px;--radius-md:10px;--radius-lg:16px}
body{font-family:var(--font-body)}h1,h2,h3{letter-spacing:-.02em}
.btn{white-space:nowrap;flex:none;font-weight:600;border-radius:10px}.btn-primary{background:#17181b;color:#fff}.btn-primary:hover{background:#2e3035}.btn-primary:active{background:#000}.btn-secondary{background:#fff;border-color:#dcdfe3}.btn-secondary:hover{background:#f4f5f7}.btn-ghost{color:#17181b}.btn-ghost:hover{background:#eef0f2}.input{background:#fff;border-color:#dcdfe3;border-radius:10px}.input:focus-visible{border-color:oklch(0.6 0.15 255)}.seg{border-radius:10px;border-color:#dcdfe3;background:#fff;overflow:hidden}.dialog{background:#fff;border-radius:16px}:focus-visible{outline-color:oklch(0.6 0.15 255)}</style>
</helmet>
<div data-screen-label="06 Suppliers" style="max-width:1480px;margin:0 auto;padding:var(--space-6) var(--space-6) 64px;display:flex;flex-direction:column;gap:var(--space-6)">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-bottom:var(--space-3);border-bottom:0">
    <div>
      <h1 style="margin:0 0 4px;font-size:28px">Suppliers</h1>
      <p style="margin:0;font-size:15px;color:var(--color-neutral-700)">12 active suppliers · $801K purchased year to date</p>
    </div>
    <div class="seg">
      <sc-for list="{{ modes }}" as="o" hint-placeholder-count="2">
        <button onClick="{{ o.go }}" style="all:unset;cursor:pointer;padding:7px 14px;font-size:13px;border-left:{{ o.border }};background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ isCards }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--space-4)">
      <sc-for list="{{ cards }}" as="s" hint-placeholder-count="9">
        <button onClick="{{ s.open }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-4);background:#fff;border:1px solid var(--color-divider);border-radius:16px" style-hover="border-color:var(--color-neutral-400)">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:25px;font-weight:600;letter-spacing:-.01em">{{ s.name }}</span><span style="font-size:13px;color:var(--color-neutral-700)">{{ s.country }} · {{ s.contact }}</span></div>
            <sc-if value="{{ s.hasAlert }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:600;padding:3px 8px;background:{{ s.alert.bg }};color:{{ s.alert.fg }}">{{ s.alertText }}</span></sc-if>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--color-divider)">
            <sc-for list="{{ s.stats }}" as="x" hint-placeholder-count="4">
              <div style="display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--color-neutral-400)">
                <span style="font-size:12.5px;color:var(--color-neutral-700)">{{ x.k }}</span>
                <span style="font-size:20px;font-weight:600;font-variant-numeric:tabular-nums">{{ x.v }}</span>
              </div>
            </sc-for>
          </div>
          <span style="font-size:13px;color:var(--color-neutral-800)">{{ s.units }} units purchased · {{ s.lead }} day avg lead time</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ isPerf }}" hint-placeholder-val="{{ false }}">
    <div style="overflow-x:auto;background:#fff;border:1px solid var(--color-divider);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(20,22,28,.04);padding:6px 20px 8px"><div style="min-width:960px">
      <div style="display:grid;grid-template-columns:minmax(140px,1fr) 90px 110px minmax(200px,1.4fr) minmax(200px,1.4fr) 100px;gap:16px;padding:10px 0;border-bottom:1px solid var(--color-divider);font-size:12.5px;color:var(--color-neutral-700)">
        <span>Supplier</span><span style="text-align:right">Orders YTD</span><span style="text-align:right">Value YTD</span><span>On-time delivery</span><span>Avg lead time</span><span>Open issues</span>
      </div>
      <sc-for list="{{ perf }}" as="s" hint-placeholder-count="12">
        <div onClick="{{ s.open }}" style="cursor:pointer;display:grid;grid-template-columns:minmax(140px,1fr) 90px 110px minmax(200px,1.4fr) minmax(200px,1.4fr) 100px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--color-neutral-200);font-size:14px" style-hover="background:var(--color-surface)">
          <span style="font-weight:600">{{ s.name }}</span>
          <span style="text-align:right;font-variant-numeric:tabular-nums">{{ s.orders }}</span>
          <span style="text-align:right;font-variant-numeric:tabular-nums">{{ s.value }}</span>
          <span style="display:grid;grid-template-columns:1fr 44px;gap:10px;align-items:center"><span style="height:8px;border-radius:4px;overflow:hidden;background:var(--color-neutral-200)"><span style="display:block;height:100%;width:{{ s.onTimeW }};background:{{ s.onTimeBg }}"></span></span><b style="text-align:right">{{ s.onTime }}</b></span>
          <span style="display:grid;grid-template-columns:1fr 56px;gap:10px;align-items:center"><span style="height:8px;border-radius:4px;overflow:hidden;background:var(--color-neutral-200)"><span style="display:block;height:100%;width:{{ s.leadW }};background:var(--color-text)"></span></span><b style="text-align:right">{{ s.lead }}</b></span>
          <span style="font-weight:600;color:{{ s.issueColor }}">{{ s.issues }}</span>
        </div>
      </sc-for>
    </div></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: null };
  componentDidMount() {
    import(new URL('fpv-data-v2.js', document.baseURI).href).then(m => { this.m = m; this.un = m.store.sub(() => this.forceUpdate()); this.forceUpdate(); });
  }
  componentWillUnmount() { this.un && this.un(); }
  renderVals() {
    const m = this.m;
    if (!m) return {};
    const st = m.store, pos = m.allPos();
    const mode = this.state.mode || (st.s.navKey === 'supplierPerf' ? 'perf' : 'cards');
    const info = s => {
      const mine = pos.filter(p => p.supplier === s.name);
      const outstanding = mine.reduce((a, p) => a + (p.pay === 'Paid' ? 0 : p.pay === 'Pending' ? p.value : p.value / 2), 0);
      const bad = mine.filter(p => p.health !== 'On Track');
      const worst = mine.find(p => p.health === 'Delayed') || bad[0];
      return { mine, outstanding, bad, worst };
    };
    const open = s => () => st.go('supplier', { supplierId: s.name });
    const cards = m.SUPPLIERS.map(s => {
      const i = info(s);
      return {
        name: s.name, country: s.country, contact: s.contact, units: s.units.toLocaleString(), lead: s.lead, open: open(s),
        hasAlert: !!i.worst, alert: i.worst ? m.badge(i.worst.health) : {}, alertText: i.worst ? i.worst.reason : '',
        stats: [['Open Orders', i.mine.length], ['Outstanding Payment', m.usdR(i.outstanding)], ['Orders YTD', s.orders], ['Purchase Value YTD', m.usdR(s.valueYTD)]].map(([k, v]) => ({ k, v }))
      };
    });
    const maxLead = Math.max(...m.SUPPLIERS.map(s => s.lead));
    const perf = [...m.SUPPLIERS].sort((a, b) => b.onTime - a.onTime).map(s => {
      const i = info(s);
      return { name: s.name, orders: s.orders, value: m.usdK(s.valueYTD), onTime: s.onTime + '%', onTimeW: s.onTime + '%', onTimeBg: s.onTime < 85 ? 'var(--color-accent)' : 'var(--color-text)', lead: s.lead + ' days', leadW: (s.lead / maxLead * 100) + '%', issues: i.bad.length || '—', issueColor: i.bad.length ? 'var(--color-accent)' : 'var(--color-neutral-600)', open: open(s) };
    });
    return {
      isCards: mode === 'cards', isPerf: mode === 'perf', cards, perf,
      modes: [['cards', 'Suppliers'], ['perf', 'Performance']].map(([k, label], i) => ({ label, go: () => this.setState({ mode: k }), bg: mode === k ? 'var(--color-text)' : 'transparent', fg: mode === k ? 'var(--color-bg)' : 'var(--color-text)', border: i ? '1px solid var(--color-divider)' : 'none' }))
    };
  }
}
</script>
</body>
</html>
