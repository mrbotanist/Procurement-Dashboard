<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/modernist-6e82d67d-20a2-45e3-801e-d6f3e66cc691/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--color-bg:#f4f5f7;--color-surface:#f0f2f4;--color-text:#17181b;--color-divider:#e3e5e8;--color-accent:oklch(0.6 0.2 25);--color-neutral-100:#f7f8f9;--color-neutral-200:#eef0f2;--color-neutral-300:#e3e5e8;--color-neutral-400:#cdd0d5;--color-neutral-500:#a3a7ae;--color-neutral-600:#80848b;--color-neutral-700:#62666d;--color-neutral-800:#45484e;--color-neutral-900:#2b2d31;--font-heading:"Hanken Grotesk",system-ui,sans-serif;--font-body:"Hanken Grotesk",system-ui,sans-serif;--font-heading-weight:600;--radius-sm:6px;--radius-md:10px;--radius-lg:16px}
body{font-family:var(--font-body)}h1,h2,h3{letter-spacing:-.02em}
.btn{white-space:nowrap;flex:none;font-weight:600;border-radius:10px}.btn-primary{background:#17181b;color:#fff}.btn-primary:hover{background:#2e3035}.btn-primary:active{background:#000}.btn-secondary{background:#fff;border-color:#dcdfe3}.btn-secondary:hover{background:#f4f5f7}.btn-ghost{color:#17181b}.btn-ghost:hover{background:#eef0f2}.input{background:#fff;border-color:#dcdfe3;border-radius:10px}.input:focus-visible{border-color:oklch(0.6 0.15 255)}.seg{border-radius:10px;border-color:#dcdfe3;background:#fff;overflow:hidden}.dialog{background:#fff;border-radius:16px}:focus-visible{outline-color:oklch(0.6 0.15 255)}</style>
</helmet>
<div data-screen-label="13 Documents" style="max-width:1480px;margin:0 auto;padding:var(--space-6) var(--space-6) 64px;display:flex;flex-direction:column;gap:var(--space-4)">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;padding-bottom:var(--space-3);border-bottom:0">
    <div>
      <h1 style="margin:0 0 4px;font-size:28px">Documents</h1>
      <p style="margin:0;font-size:15px;color:var(--color-neutral-700)">{{ summary }}</p>
    </div>
    <button class="btn btn-primary">Upload document</button>
  </div>
  <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:end">
    <div class="field" style="flex:1 1 280px"><label>Search</label><input class="input" value="{{ q }}" onChange="{{ onQ }}" placeholder="File name, PO number or supplier"></input></div>
    <div class="field" style="flex:0 1 220px"><label>Supplier</label><select class="input" value="{{ supplier }}" onChange="{{ onSupplier }}"><sc-for list="{{ suppliers }}" as="s" hint-placeholder-count="5"><option value="{{ s }}">{{ s }}</option></sc-for></select></div>
  </div>
  <div style="display:flex;flex-wrap:wrap;border:1px solid var(--color-divider);align-self:flex-start;border-radius:10px;overflow:hidden;background:#fff">
    <sc-for list="{{ types }}" as="t" hint-placeholder-count="8">
      <button onClick="{{ t.go }}" style="all:unset;cursor:pointer;padding:7px 12px;font-size:13px;display:flex;gap:6px;border-right:1px solid var(--color-divider);background:{{ t.bg }};color:{{ t.fg }}">{{ t.k }}<b>{{ t.n }}</b></button>
    </sc-for>
  </div>
  <div style="overflow-x:auto;background:#fff;border:1px solid var(--color-divider);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(20,22,28,.04);padding:6px 20px 8px"><div style="min-width:860px">
    <div style="display:grid;grid-template-columns:50px minmax(220px,1.6fr) 170px 100px 120px 80px 100px;gap:12px;padding:10px 0;border-bottom:1px solid var(--color-divider);font-size:12.5px;color:var(--color-neutral-700)">
      <span>Type</span><span>File</span><span>Document</span><span>PO</span><span>Supplier</span><span>Added</span><span></span>
    </div>
    <sc-for list="{{ rows }}" as="d" hint-placeholder-count="12">
      <div style="display:grid;grid-template-columns:50px minmax(220px,1.6fr) 170px 100px 120px 80px 100px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--color-neutral-200);font-size:14px" style-hover="background:var(--color-surface)">
        <span style="font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--color-text);color:var(--color-bg);text-align:center">{{ d.ext }}</span>
        <b>{{ d.file }}</b>
        <span>{{ d.type }}</span>
        <button onClick="{{ d.open }}" style="all:unset;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums" style-hover="color:var(--color-accent)">{{ d.po }}</button>
        <span>{{ d.supplier }}</span>
        <span style="color:var(--color-neutral-800)">{{ d.date }}</span>
        <button class="btn btn-ghost" style="justify-self:start">Download</button>
      </div>
    </sc-for>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:40px 0;font-size:15px;color:var(--color-neutral-700)">No documents match.</div></sc-if>
  </div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { type: 'All', q: '', supplier: 'All suppliers' };
  componentDidMount() {
    import(new URL('fpv-data-v2.js', document.baseURI).href).then(m => { this.m = m; this.un = m.store.sub(() => this.forceUpdate()); this.forceUpdate(); });
  }
  componentWillUnmount() { this.un && this.un(); }
  renderVals() {
    const m = this.m;
    if (!m) return {};
    const S = this.state, q = S.q.trim().toLowerCase();
    const all = m.allDocs();
    const typeNames = ['All', ...Array.from(new Set(all.map(d => d.type)))];
    const bySup = all.filter(d => S.supplier === 'All suppliers' || d.supplier === S.supplier);
    const rows = bySup.filter(d => (S.type === 'All' || d.type === S.type) && (!q || (d.file + ' ' + d.po + ' ' + d.supplier).toLowerCase().includes(q)));
    return {
      summary: all.length + ' files across ' + m.allPos().length + ' purchase orders',
      q: S.q, onQ: e => this.setState({ q: e.target.value }),
      supplier: S.supplier, suppliers: ['All suppliers', ...m.SUPPLIERS.map(s => s.name)], onSupplier: e => this.setState({ supplier: e.target.value }),
      types: typeNames.map(k => ({ k, n: k === 'All' ? bySup.length : bySup.filter(d => d.type === k).length, go: () => this.setState({ type: k }), bg: S.type === k ? 'var(--color-text)' : 'transparent', fg: S.type === k ? 'var(--color-bg)' : 'var(--color-text)' })),
      rows: rows.map(d => ({ ...d, open: () => m.store.openPo(d.po) })), empty: rows.length === 0
    };
  }
}
</script>
</body>
</html>
